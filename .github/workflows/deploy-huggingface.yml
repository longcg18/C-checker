name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - backend.py
      - database.py
      - requirements.txt
      - Dockerfile
      - .github/workflows/deploy-huggingface.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Sync backend files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing required GitHub Actions secret: HF_TOKEN"
            exit 1
          fi

          git clone "https://longcg18:${HF_TOKEN}@huggingface.co/spaces/longcg18/c-checker-demo.git" hf-space
          cp backend.py database.py requirements.txt Dockerfile hf-space/

          cd hf-space
          if git diff --quiet; then
            echo "Hugging Face Space is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend.py database.py requirements.txt Dockerfile
          git commit -m "deploy: sync backend from GitHub ${GITHUB_SHA::7}"
          git push origin main
